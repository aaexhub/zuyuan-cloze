<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祖源选词填空练习系统</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .progress-bar {
            background: rgba(255,255,255,0.3);
            height: 8px;
            border-radius: 4px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.5s ease;
            border-radius: 4px;
        }
        
        .content { padding: 30px; }
        
        /* 首页 */
        .unit-select { display: none; }
        .unit-select.active { display: block; }
        
        .unit-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .unit-card {
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .unit-card:hover {
            border-color: #10b981;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(16,185,129,0.2);
        }
        
        .unit-card .unit-num {
            font-size: 48px;
            font-weight: bold;
            color: #10b981;
        }
        
        .unit-card .unit-title {
            font-size: 18px;
            font-weight: 600;
            margin: 8px 0;
        }
        
        .unit-card .unit-topic {
            font-size: 14px;
            color: #6b7280;
        }
        
        .unit-card .unit-count {
            font-size: 13px;
            color: #10b981;
            margin-top: 12px;
            font-weight: 500;
        }
        
        /* 文章列表 */
        .article-list { display: none; }
        .article-list.active { display: block; }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
            border: none;
            background: #f3f4f6;
        }
        
        .back-btn:hover {
            background: #e5e7eb;
            color: #374151;
        }
        
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .list-header h2 { font-size: 22px; color: #1f2937; }
        
        .article-items { display: flex; flex-direction: column; gap: 12px; }
        
        .article-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #f9fafb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .article-item:hover {
            background: #ecfdf5;
            border-color: #10b981;
        }
        
        .article-item .item-info { flex: 1; }
        
        .article-item .item-title {
            font-size: 15px;
            font-weight: 500;
            color: #1f2937;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 400px;
        }
        
        .article-item .item-meta {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 4px;
        }
        
        .article-item .item-status {
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .status-new { background: #dbeafe; color: #1d4ed8; }
        .status-done { background: #d1fae5; color: #059669; }
        
        /* 练习页面 */
        .practice { display: none; }
        .practice.active { display: block; }
        
        .practice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .practice-header h2 {
            font-size: 20px;
            color: #1f2937;
        }
        
        .stats-mini {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #6b7280;
        }
        
        .stats-mini span { font-weight: 600; color: #10b981; }
        
        /* 备选词区 */
        .options-box {
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 2px dashed #10b981;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }
        
        .options-box .options-label {
            font-size: 13px;
            font-weight: 600;
            color: #059669;
            margin-bottom: 10px;
        }
        
        .options-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .option-word {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            background: white;
            border: 2px solid #10b981;
            border-radius: 20px;
            font-size: 14px;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        
        .option-word:hover {
            background: #10b981;
            color: white;
            transform: scale(1.05);
        }
        
        .option-word.used {
            opacity: 0.4;
            cursor: not-allowed;
            text-decoration: line-through;
        }
        
        .option-word.correct {
            background: #10b981;
            color: white;
            border-color: #059669;
        }
        
        .option-word.wrong {
            background: #ef4444;
            color: white;
            border-color: #dc2626;
        }
        
        /* 文章区 */
        .passage-box {
            background: #f9fafb;
            border-radius: 12px;
            padding: 24px;
            line-height: 2;
            font-size: 15px;
            color: #374151;
        }
        
        .passage-box p {
            margin-bottom: 12px;
            text-indent: 2em;
        }
        
        .blank-input {
            display: inline-block;
            width: 100px;
            border: none;
            border-bottom: 2px solid #d1d5db;
            background: #fff;
            text-align: center;
            font-size: 14px;
            color: #10b981;
            font-weight: 600;
            padding: 2px 4px;
            margin: 0 2px;
            transition: all 0.2s;
            border-radius: 4px 4px 0 0;
        }
        
        .blank-input:focus {
            outline: none;
            border-bottom-color: #10b981;
            box-shadow: 0 2px 0 #10b981;
        }
        
        .blank-input.correct {
            border-bottom-color: #10b981;
            color: #059669;
            background: #ecfdf5;
        }
        
        .blank-input.wrong {
            border-bottom-color: #ef4444;
            color: #ef4444;
            background: #fef2f2;
        }
        
        .blank-label {
            font-size: 11px;
            color: #9ca3af;
            font-weight: normal;
            margin-right: 2px;
        }
        
        /* 按钮 */
        .btn-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
        }
        
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16,185,129,0.4);
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        
        .btn-secondary:hover {
            background: #e5e7eb;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        /* 提示区 */
        .hint-box {
            display: none;
            background: #fffbeb;
            border: 1px solid #fbbf24;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 14px;
            color: #92400e;
        }
        
        .hint-box.show { display: block; }
        
        /* 完成页面 */
        .complete { display: none; }
        .complete.active { display: block; text-align: center; padding: 40px 20px; }
        
        .complete .emoji { font-size: 64px; margin-bottom: 16px; }
        
        .complete h2 {
            font-size: 24px;
            color: #1f2937;
            margin-bottom: 8px;
        }
        
        .complete .score {
            font-size: 48px;
            font-weight: bold;
            color: #10b981;
            margin: 20px 0;
        }
        
        .complete .detail { font-size: 15px; color: #6b7280; margin-bottom: 24px; }
        
        /* 总览统计 */
        .overview-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .ov-stat {
            background: #f9fafb;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        
        .ov-stat .num {
            font-size: 28px;
            font-weight: bold;
            color: #10b981;
        }
        
        .ov-stat .label {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }
        
        /* 移动端适配 */
        @media (max-width: 640px) {
            body { padding: 10px; }
            .container { border-radius: 16px; }
            .header { padding: 20px; }
            .header h1 { font-size: 22px; }
            .content { padding: 20px; }
            .passage-box { padding: 16px; font-size: 14px; line-height: 1.8; }
            .blank-input { width: 80px; font-size: 13px; }
            .unit-cards { grid-template-columns: 1fr; }
            .overview-stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 选词填空练习</h1>
            <div class="subtitle">外研版八年级下册 · Unit 1-2</div>
            <div class="progress-bar" id="globalProgress" style="display:none;">
                <div class="progress-fill" id="globalProgressFill" style="width:0%"></div>
            </div>
        </div>
        
        <div class="content">
            <!-- 首页：单元选择 -->
            <div class="unit-select active" id="unitSelect">
                <div class="overview-stats" id="overviewStats">
                    <div class="ov-stat">
                        <div class="num" id="statTotal">25</div>
                        <div class="label">总篇数</div>
                    </div>
                    <div class="ov-stat">
                        <div class="num" id="statDone">0</div>
                        <div class="label">已完成</div>
                    </div>
                    <div class="ov-stat">
                        <div class="num" id="statRate">-</div>
                        <div class="label">完成率</div>
                    </div>
                </div>
                <h2 style="margin-bottom:16px;color:#1f2937;">选择单元</h2>
                <div class="unit-cards" id="unitCards"></div>
            </div>
            
            <!-- 文章列表 -->
            <div class="article-list" id="articleList">
                <button class="back-btn" onclick="showUnits()">← 返回</button>
                <div class="list-header">
                    <h2 id="listTitle">Unit 1</h2>
                </div>
                <div class="article-items" id="articleItems"></div>
            </div>
            
            <!-- 练习页面 -->
            <div class="practice" id="practice">
                <button class="back-btn" onclick="showArticles()">← 返回列表</button>
                <div class="practice-header">
                    <h2 id="practiceTitle">第1篇</h2>
                    <div class="stats-mini">
                        空格: <span id="blankCount">0</span> | 
                        备选词: <span id="optCount">0</span>
                    </div>
                </div>
                
                <div class="options-box">
                    <div class="options-label">📋 备选词（点击可填入当前选中的空格）</div>
                    <div class="options-list" id="optionsList"></div>
                </div>
                
                <div class="passage-box" id="passageBox"></div>
                
                <div class="btn-row">
                    <button class="btn btn-secondary" onclick="clearAll()">清空</button>
                    <button class="btn btn-primary" id="submitBtn" onclick="showAnswers()">查看答案</button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextArticle()" style="display:none;">下一篇 →</button>
                </div>
                
                <div class="hint-box" id="hintBox"></div>
            </div>
            
            <!-- 完成页面 -->
            <div class="complete" id="complete">
                <div class="emoji">🎉</div>
                <h2>本单元全部完成！</h2>
                <div class="score" id="completeScore">-</div>
                <div class="detail" id="completeDetail"></div>
                <div class="btn-row">
                    <button class="btn btn-secondary" onclick="showUnits()">返回首页</button>
                </div>
            </div>
        </div>
    </div>

<script>
let questions = [];
let currentUnit = null;
let currentArticle = null;
let currentIdx = 0;
let answered = new Set();
let activeBlank = null;
let showAnswered = false;

// 初始化
async function init() {
    try {
        const resp = await fetch('cloze.json');
        questions = await resp.json();
    } catch(e) {
        console.error('Failed to load cloze.json:', e);
        return;
    }
    
    // 加载进度
    try {
        const saved = localStorage.getItem('cloze-progress');
        if (saved) answered = new Set(JSON.parse(saved));
    } catch(e) {}
    
    updateStats();
    renderUnits();
    showPage('unitSelect');
}

function updateStats() {
    const total = questions.length;
    const done = answered.size;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statDone').textContent = done;
    document.getElementById('statRate').textContent = total > 0 ? Math.round(done/total*100)+'%' : '-';
    
    const prog = document.getElementById('globalProgress');
    const fill = document.getElementById('globalProgressFill');
    if (done > 0) {
        prog.style.display = 'block';
        fill.style.width = Math.round(done/total*100)+'%';
    }
}

function renderUnits() {
    const units = {};
    questions.forEach(q => {
        if (!units[q.unit]) {
            units[q.unit] = { unit: q.unit, title: q.unitTitle, topic: q.topic, count: 0 };
        }
        units[q.unit].count++;
    });
    
    const container = document.getElementById('unitCards');
    container.innerHTML = Object.values(units).map(u => `
        <div class="unit-card" onclick="selectUnit(${u.unit})">
            <div class="unit-num">U${u.unit}</div>
            <div class="unit-title">${u.title}</div>
            <div class="unit-topic">${u.topic}</div>
            <div class="unit-count">${u.count} 篇文章</div>
        </div>
    `).join('');
}

function selectUnit(unit) {
    currentUnit = unit;
    const unitQ = questions.filter(q => q.unit === unit);
    const u = unitQ[0];
    
    document.getElementById('listTitle').textContent = `Unit ${unit} · ${u.unitTitle}`;
    
    const container = document.getElementById('articleItems');
    container.innerHTML = unitQ.map((q, i) => {
        const done = answered.has(q.id);
        return `
            <div class="article-item" onclick="startPractice(${q.id})">
                <div class="item-info">
                    <div class="item-title">第${q.articleIndex}篇 · ${q.title.substring(0,50)}${q.title.length>50?'...':''}</div>
                    <div class="item-meta">${q.blanks.length} 个空格 · ${q.options.length} 个备选词</div>
                </div>
                <div class="item-status ${done ? 'status-done' : 'status-new'}">${done ? '已完成' : '未做'}</div>
            </div>
        `;
    }).join('');
    
    showPage('articleList');
}

function startPractice(id) {
    currentArticle = questions.find(q => q.id === id);
    if (!currentArticle) return;
    
    showAnswered = false;
    activeBlank = null;
    
    document.getElementById('practiceTitle').textContent = `第${currentArticle.articleIndex}篇`;
    document.getElementById('blankCount').textContent = currentArticle.blanks.length;
    document.getElementById('optCount').textContent = currentArticle.options.length;
    document.getElementById('submitBtn').style.display = '';
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('hintBox').classList.remove('show');
    
    renderOptions();
    renderPassage();
    showPage('practice');
}

function renderOptions() {
    const container = document.getElementById('optionsList');
    container.innerHTML = currentArticle.options.map((opt, i) => `
        <div class="option-word" data-idx="${i}" data-word="${opt}" onclick="clickOption(this)">${opt}</div>
    `).join('');
}

function renderPassage() {
    const box = document.getElementById('passageBox');
    let html = currentArticle.passage;
    
    // 将 ___N___ 替换为输入框
    html = html.replace(/___(\d+)___/g, (match, num) => {
        return `<span class="blank-label">(${num})</span><input type="text" class="blank-input" data-blank="${num}" 
            onfocus="onBlankFocus(this)" oninput="onBlankInput(this)" autocomplete="off" spellcheck="false">`;
    });
    
    // 段落分割
    const paragraphs = html.split('\n').filter(p => p.trim());
    box.innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');
}

function onBlankFocus(el) {
    activeBlank = el;
    // 高亮当前空格
    document.querySelectorAll('.blank-input').forEach(inp => {
        inp.style.background = inp === el ? '#ecfdf5' : '';
    });
}

function onBlankInput(el) {
    const val = el.value.trim();
    // 标记已使用的备选词
    const allInputs = Array.from(document.querySelectorAll('.blank-input'));
    const usedWords = new Set(allInputs.map(inp => inp.value.trim()).filter(v => v));
    
    document.querySelectorAll('.option-word').forEach(ow => {
        const word = ow.dataset.word;
        if (showAnswered) return;
        ow.classList.toggle('used', usedWords.has(word) && !Array.from(allInputs).some(inp => inp === activeBlank && inp.value.trim() === word));
    });
}

function clickOption(el) {
    if (!activeBlank || showAnswered) return;
    if (el.classList.contains('used')) return;
    
    const word = el.dataset.word;
    activeBlank.value = word;
    onBlankInput(activeBlank);
    
    // 自动跳到下一个空输入框
    const inputs = Array.from(document.querySelectorAll('.blank-input'));
    const idx = inputs.indexOf(activeBlank);
    if (idx < inputs.length - 1) {
        for (let i = idx + 1; i < inputs.length; i++) {
            if (!inputs[i].value.trim()) {
                inputs[i].focus();
                break;
            }
        }
    }
}

function clearAll() {
    if (showAnswered) return;
    document.querySelectorAll('.blank-input').forEach(inp => {
        inp.value = '';
        inp.classList.remove('correct', 'wrong');
        inp.style.background = '';
    });
    document.querySelectorAll('.option-word').forEach(ow => {
        ow.classList.remove('used', 'correct', 'wrong');
    });
}

function showAnswers() {
    if (showAnswered) return;
    showAnswered = true;
    
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = '';
    
    const inputs = Array.from(document.querySelectorAll('.blank-input'));
    let filled = 0;
    let total = inputs.length;
    
    inputs.forEach(inp => {
        const val = inp.value.trim();
        if (val) {
            filled++;
            inp.classList.add('correct');
            inp.readOnly = true;
        } else {
            inp.style.background = '#fef2f2';
        }
    });
    
    // 标记完成
    answered.add(currentArticle.id);
    localStorage.setItem('cloze-progress', JSON.stringify([...answered]));
    updateStats();
    
    const pct = total > 0 ? Math.round(filled/total*100) : 0;
    document.getElementById('hintBox').innerHTML = 
        `✅ 已填入 <strong>${filled}</strong>/${total} 个空格（${pct}%）` +
        (filled < total ? `<br>⚠️ 还有 <strong>${total-filled}</strong> 个空格未填写，再试试吧！` : ' 🎉 全部填完了！');
    document.getElementById('hintBox').classList.add('show');
}

function nextArticle() {
    if (!currentUnit) { showUnits(); return; }
    const unitQ = questions.filter(q => q.unit === currentUnit);
    const idx = unitQ.findIndex(q => q.id === currentArticle.id);
    
    if (idx < unitQ.length - 1) {
        startPractice(unitQ[idx + 1].id);
    } else {
        // 单元完成
        showComplete();
    }
}

function showComplete() {
    const unitQ = questions.filter(q => q.unit === currentUnit);
    const done = unitQ.filter(q => answered.has(q.id)).length;
    document.getElementById('completeScore').textContent = `${done}/${unitQ.length}`;
    document.getElementById('completeDetail').textContent = `Unit ${currentUnit} 共 ${unitQ.length} 篇，已完成 ${done} 篇`;
    showPage('complete');
}

function showPage(page) {
    document.querySelectorAll('.unit-select, .article-list, .practice, .complete').forEach(el => {
        el.classList.remove('active');
    });
    document.getElementById(page).classList.add('active');
}

function showUnits() {
    currentUnit = null;
    updateStats();
    renderUnits();
    showPage('unitSelect');
}

function showArticles() {
    if (currentUnit) selectUnit(currentUnit);
    else showUnits();
}

// 启动
init();
</script>
</body>
</html>
